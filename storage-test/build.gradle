group 'com.vitalex.ramus'
version '1.0-SNAPSHOT'

apply plugin: 'java'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation project(':common')
    testImplementation project(':core')
    testImplementation project(':database-storage')
    testImplementation project(':core-simple-attributes')
    testImplementation project(':data-framework-common')
    testImplementation project(':idef0-core')
    testImplementation project(':idef0-common')
    testImplementation project(':report-core')
    testImplementation project(':chart-core')

    testImplementation group: 'junit', name: 'junit', version: '4.11'
    testRuntimeOnly 'com.h2database:h2:1.3.163'
}

test {
    ['ramus.dump.target', 'ramus.dump.sample', 'ramus.diagnose', 'ramus.golden.update', 'ramus.schema.target'].each { name ->
        if (System.getProperty(name)) {
            systemProperty name, System.getProperty(name)
        }
    }

    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
        showStandardStreams = false
    }
}
